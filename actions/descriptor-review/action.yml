name: Tool Descriptor Review
description: Retain the full structural inventory and separate policy findings, with counts-only job summaries by default.
inputs:
  before:
    description: Before snapshot JSON path.
    required: true
  after:
    description: After snapshot JSON path.
    required: true
  report:
    description: Local full JSON report path. Contains descriptor values. Not automatically uploaded.
    required: false
    default: artifacts/descriptor-review.json
  summary:
    description: Local Markdown summary path.
    required: false
    default: artifacts/descriptor-review.md
  summary-disclosure:
    description: "Summary disclosure: counts, paths (identifiers), or full (values)."
    required: false
    default: counts
  post-summary:
    description: Append the selected summary to the GitHub job summary.
    required: false
    default: "true"
  fail-on:
    description: "Gate after writing reports: none, change, or findings. Errors fail separately."
    required: false
    default: none
outputs:
  status:
    description: Changed or unchanged after a successful comparison. Neither means approval.
    value: ${{ steps.review.outputs.status }}
  change-count:
    description: Number of structural changes.
    value: ${{ steps.review.outputs.change-count }}
  policy-finding-count:
    description: Number of supplemental policy findings.
    value: ${{ steps.review.outputs.policy-finding-count }}
  report-path:
    description: Path to the local full JSON report. Treat as sensitive.
    value: ${{ steps.review.outputs.report-path }}
  summary-path:
    description: Path to the local Markdown summary at the selected disclosure level.
    value: ${{ steps.review.outputs.summary-path }}
runs:
  using: composite
  steps:
    - name: Install descriptor review
      shell: bash
      env:
        TCD_ACTION_ROOT: ${{ github.action_path }}/../..
      run: python -m pip install --no-deps "$TCD_ACTION_ROOT"
    - name: Review descriptors
      id: review
      shell: bash
      env:
        TCD_REVIEW_BEFORE: ${{ inputs.before }}
        TCD_REVIEW_AFTER: ${{ inputs.after }}
        TCD_REVIEW_REPORT: ${{ inputs.report }}
        TCD_REVIEW_SUMMARY: ${{ inputs.summary }}
        TCD_REVIEW_DISCLOSURE: ${{ inputs.summary-disclosure }}
        TCD_REVIEW_POST_SUMMARY: ${{ inputs.post-summary }}
        TCD_REVIEW_FAIL_ON: ${{ inputs.fail-on }}
      run: python -B -m tool_contract_drift.review_action
