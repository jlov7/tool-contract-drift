name: Tool Contract Drift
description: Lint agent tool descriptor drift and emit Markdown, JSON, or SARIF reports.
inputs:
  before:
    description: Before descriptor JSON path for single-pair linting.
    required: false
  after:
    description: After descriptor JSON path for single-pair linting.
    required: false
  fixtures:
    description: Optional fixture JSON path for batch linting.
    required: false
  format:
    description: "Output format: markdown, json, or sarif."
    required: false
    default: sarif
  output:
    description: Output report path.
    required: false
    default: tool-contract-drift.sarif
  fail-on:
    description: "Failure threshold: none, any, medium, or high."
    required: false
    default: none
  config:
    description: Optional Agent Tool Contract Drift config JSON path.
    required: false
  builtin-corpus:
    description: Explicitly run the packaged public-reproduction-53 corpus when no before/after or fixture path is provided.
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Install tool-contract-drift
      shell: bash
      env:
        TCD_ACTION_ROOT: ${{ github.action_path }}
      run: python -I -m pip install --no-deps "$TCD_ACTION_ROOT"
    - name: Run tool-contract-drift
      shell: bash
      env:
        TCD_BEFORE: ${{ inputs.before }}
        TCD_AFTER: ${{ inputs.after }}
        TCD_FIXTURES: ${{ inputs.fixtures }}
        TCD_FORMAT: ${{ inputs.format }}
        TCD_OUTPUT: ${{ inputs.output }}
        TCD_FAIL_ON: ${{ inputs.fail-on }}
        TCD_CONFIG: ${{ inputs.config }}
        TCD_BUILTIN_CORPUS: ${{ inputs.builtin-corpus }}
      run: |
        set -euo pipefail
        cmd=(python -I -B -m tool_contract_drift_cli lint --format "$TCD_FORMAT" --output "$TCD_OUTPUT" --fail-on "$TCD_FAIL_ON")
        if [[ -n "$TCD_CONFIG" ]]; then
          cmd+=(--config "$TCD_CONFIG")
        fi
        if [[ -n "$TCD_BEFORE" || -n "$TCD_AFTER" ]]; then
          if [[ -z "$TCD_BEFORE" || -z "$TCD_AFTER" ]]; then
            echo "Provide both before and after descriptor paths." >&2
            exit 2
          fi
          cmd+=(--before "$TCD_BEFORE" --after "$TCD_AFTER")
        elif [[ -n "$TCD_FIXTURES" ]]; then
          cmd+=(--fixture "$TCD_FIXTURES")
        elif [[ "$TCD_BUILTIN_CORPUS" == "true" ]]; then
          cmd+=(--builtin-corpus)
        else
          echo "Provide before/after, fixtures, or builtin-corpus: true." >&2
          exit 2
        fi
        "${cmd[@]}"
