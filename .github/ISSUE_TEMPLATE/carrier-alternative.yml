name: Alternative tool or workflow
description: Show how an existing tool or a simpler workflow could replace this utility.
title: "[Carrier] "
body:
  - type: markdown
    attributes:
      value: |
        Existing tools may already cover this workflow. Show what the alternative does and distinguish independent comparisons from configurations that reuse this project's policy. The configured-policy and oasdiff results here show portability, not comparator superiority.
  - type: dropdown
    id: carrier
    attributes:
      label: Proposed carrier
      options:
        - Existing MCP or registry review process
        - Spectral ruleset or wrapper
        - oasdiff extension or custom checks
        - GitHub Action only
        - Support library or API
        - Policy and corpus only
        - Paper or research note only
        - Archive this project; no separate tool needed
        - Other existing tool or process
    validations:
      required: true
  - type: textarea
    id: mapping
    attributes:
      label: How it compares
      description: Show which inputs, changed fields, policy labels and review tasks the alternative covers.
    validations:
      required: true
  - type: dropdown
    id: independence
    attributes:
      label: Comparator independence
      options:
        - Independent implementation and semantics
        - Existing tool with new custom configuration
        - Reuses this repository's predicates or policy
        - Design proposal only; not implemented
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Runnable evidence
      description: Link code or give exact commands and results. State explicitly when no runnable comparison exists.
    validations:
      required: true
  - type: textarea
    id: decision
    attributes:
      label: Recommended decision
      description: Explain whether to integrate with the alternative, narrow this project, or archive it.
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: Evidence boundary
      options:
        - label: I distinguished independent comparator evidence from transport or shared-policy parity.
          required: true
        - label: I did not present stars, downloads, impressions, or rank as validation evidence.
          required: true
