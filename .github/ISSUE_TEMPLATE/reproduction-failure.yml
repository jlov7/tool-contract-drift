name: Reproduction failure
description: Report a documented command, package, export, or result that does not reproduce.
title: "[Reproduction] "
body:
  - type: markdown
    attributes:
      value: |
        Include the command, documented expectation and observed result, including failures. Prefer a small synthetic example. Do not include secrets, private reviewer material or third-party text you cannot redistribute.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Give the package version and exact commit or archive SHA-256 when available.
      placeholder: 0.1.0a0; commit or archive SHA-256
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - Public source export
        - Wheel
        - Source distribution
        - CLI
        - Python API
        - GitHub Action
        - SARIF
        - Paper or report
        - Other documented command
    validations:
      required: true
  - type: dropdown
    id: corpus
    attributes:
      label: Corpus identity
      description: Select the corpus actually used. Do not infer one from a path.
      options:
        - public-reproduction-53
        - another corpus (give its identity below)
        - explicit custom fixture files
        - not applicable
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, architecture, Python/uv version, and relevant tool versions.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Exact command
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Documented expectation
      description: Link or quote the specific local documentation or manifest field you expected to reproduce.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed result
      description: Include exit status and the smallest useful error excerpt.
    validations:
      required: true
  - type: textarea
    id: minimal_input
    attributes:
      label: Minimal redacted input
      description: Prefer a synthetic descriptor pair. Remove tokens, private paths, employer data, and uncleared third-party content.
      render: json
  - type: checkboxes
    id: boundaries
    attributes:
      label: Submission boundaries
      options:
        - label: I removed secrets, private reviewer or study material, personal data, and employer/client-confidential information.
          required: true
        - label: I understand that a reproduction failure is evidence about this artifact, not proof that a tool is safe or vulnerable.
          required: true
