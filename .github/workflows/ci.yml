name: Public artifact CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.28"
      - name: Install PDF text audit tool
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends poppler-utils
          command -v pdftotext
      - name: Verify exact public file set and corpus
        run: PYTHONDONTWRITEBYTECODE=1 python scripts/verify_public_export.py .
      - name: Audit public tracked tree and reachable history
        run: PYTHONDONTWRITEBYTECODE=1 python scripts/verify_public_history.py .
      - name: Check lockfile
        run: uv lock --check
      - name: Run public distribution tests
        run: PYTHONDONTWRITEBYTECODE=1 uv run --locked python -m unittest discover -s public_tests -v
      - name: Build wheel and source distribution
        run: uv build
      - name: Verify wheel and source-distribution bytes
        run: PYTHONDONTWRITEBYTECODE=1 python scripts/verify_built_distributions.py --dist dist
      - name: Install and test wheel
        run: |
          uv venv /tmp/tcd-wheel
          uv pip install --python /tmp/tcd-wheel/bin/python dist/*.whl
          /tmp/tcd-wheel/bin/tool-descriptor-review \
            --before examples/before_descriptor.json \
            --after examples/after_descriptor.json --format json \
            --output /tmp/wheel-review.json
          /tmp/tcd-wheel/bin/python -c 'import json; d=json.load(open("/tmp/wheel-review.json")); assert d["status"] == "changed" and d["change_count"] > 0 and d["policy_findings"]'
          /tmp/tcd-wheel/bin/tool-contract-drift lint \
            --corpus public-reproduction-53 \
            --format json \
            --output /tmp/wheel-public.json
          /tmp/tcd-wheel/bin/tool-contract-drift configured-baselines \
            --corpus public-reproduction-53 \
            --output /tmp/wheel-carriers.md \
            --json /tmp/wheel-carriers.json
          private_id=$(/tmp/tcd-wheel/bin/python -c 'from tool_contract_drift.corpora import PRIVATE_CANONICAL_CORPUS_ID; print(PRIVATE_CANONICAL_CORPUS_ID)')
          if /tmp/tcd-wheel/bin/tool-contract-drift lint \
            --corpus "$private_id" \
            --format json; then
            echo "Private corpus unexpectedly available in the wheel" >&2
            exit 1
          fi
          /tmp/tcd-wheel/bin/python -c 'import json; d=json.load(open("/tmp/wheel-public.json")); assert d["corpus"]["id"] == "public-reproduction-53" and d["corpus"]["fixture_count"] == 53 and d["summary"]["total_findings"] == 25'
          /tmp/tcd-wheel/bin/python -c 'import json; s=json.load(open("/tmp/wheel-carriers.json"))["summary"]; assert s["fixture_count"] == s["configured_spectral_exact_matches"] == s["oasdiff_mapper_exact_matches"] == 53'
      - name: Install and test source distribution
        run: |
          uv venv /tmp/tcd-sdist
          uv pip install --python /tmp/tcd-sdist/bin/python dist/*.tar.gz
          /tmp/tcd-sdist/bin/tool-descriptor-review \
            --before examples/before_descriptor.json \
            --after examples/after_descriptor.json --format json \
            --output /tmp/sdist-review.json
          /tmp/tcd-sdist/bin/python -c 'import json; d=json.load(open("/tmp/sdist-review.json")); assert d["status"] == "changed" and d["change_count"] > 0 and d["policy_findings"]'
          /tmp/tcd-sdist/bin/tool-contract-drift lint \
            --corpus public-reproduction-53 \
            --format json \
            --output /tmp/sdist-public.json
          /tmp/tcd-sdist/bin/tool-contract-drift configured-baselines \
            --corpus public-reproduction-53 \
            --output /tmp/sdist-carriers.md \
            --json /tmp/sdist-carriers.json
          private_id=$(/tmp/tcd-sdist/bin/python -c 'from tool_contract_drift.corpora import PRIVATE_CANONICAL_CORPUS_ID; print(PRIVATE_CANONICAL_CORPUS_ID)')
          if /tmp/tcd-sdist/bin/tool-contract-drift lint \
            --corpus "$private_id" \
            --format json; then
            echo "Private corpus unexpectedly available in the source distribution" >&2
            exit 1
          fi
          /tmp/tcd-sdist/bin/python -c 'import json; d=json.load(open("/tmp/sdist-public.json")); assert d["corpus"]["id"] == "public-reproduction-53" and d["corpus"]["fixture_count"] == 53 and d["summary"]["total_findings"] == 25'
          /tmp/tcd-sdist/bin/python -c 'import json; s=json.load(open("/tmp/sdist-carriers.json"))["summary"]; assert s["fixture_count"] == s["configured_spectral_exact_matches"] == s["oasdiff_mapper_exact_matches"] == 53'
      - name: Exercise composite Action public corpus
        uses: ./
        with:
          builtin-corpus: "true"
          format: sarif
          output: /tmp/action-public.sarif
          fail-on: none
      - name: Validate Action output boundary
        run: |
          python -c 'import json; d=json.load(open("/tmp/action-public.sarif")); r=d["runs"][0]; assert r["tool"]["driver"]["properties"]["corpus_id"] == "public-reproduction-53" and len(r["results"]) == 25'
      - name: Exercise complete-inventory Action on an unlabeled change
        id: quiet-review
        continue-on-error: true
        uses: ./actions/descriptor-review
        with:
          before: examples/before_quiet_change.json
          after: examples/after_quiet_change.json
          report: /tmp/quiet-review.json
          summary: /tmp/quiet-review.md
          fail-on: change
      - name: Verify the unlabeled change gate and minimized summary
        env:
          REVIEW_OUTCOME: ${{ steps.quiet-review.outcome }}
          REVIEW_STATUS: ${{ steps.quiet-review.outputs.status }}
          CHANGE_COUNT: ${{ steps.quiet-review.outputs.change-count }}
          FINDING_COUNT: ${{ steps.quiet-review.outputs.policy-finding-count }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path("/tmp/quiet-review.json").read_text())
          summary = Path("/tmp/quiet-review.md").read_text()
          assert os.environ["REVIEW_OUTCOME"] == "failure"
          assert os.environ["REVIEW_STATUS"] == "changed"
          assert os.environ["CHANGE_COUNT"] == "1" and os.environ["FINDING_COUNT"] == "0"
          assert report["change_count"] == 1 and report["policy_findings"] == []
          assert report["changes"][0]["path"] == "/tools/lookup_document/inputSchema/properties/query/description"
          assert "lookup_document" not in summary and "Document title" not in summary
          assert "sha256" not in summary and "Disclosure: counts." in summary
          PY
      - name: Exercise complete-inventory Action input failure
        id: invalid-review
        continue-on-error: true
        uses: ./actions/descriptor-review
        with:
          before: examples/before_quiet_change.json
          after: examples/missing-review-input.json
          report: /tmp/invalid-review.json
          summary: /tmp/invalid-review.md
      - name: Verify failed input cannot report unchanged
        env:
          REVIEW_OUTCOME: ${{ steps.invalid-review.outcome }}
          REVIEW_STATUS: ${{ steps.invalid-review.outputs.status }}
          CHANGE_COUNT: ${{ steps.invalid-review.outputs.change-count }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          assert os.environ["REVIEW_OUTCOME"] == "failure"
          assert os.environ["REVIEW_STATUS"] == "" and os.environ["CHANGE_COUNT"] == ""
          assert not Path("/tmp/invalid-review.json").exists()
          assert not Path("/tmp/invalid-review.md").exists()
          PY
